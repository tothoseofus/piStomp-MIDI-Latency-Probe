name: Build piStomp MIDI Latency Probe (aarch64)
on:
  push:
  workflow_dispatch:
jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu lv2-dev zip
      - name: Build and package
        run: make package
      - name: Upload LV2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: pistomp-midi-latency-probe-aarch64
          path: pistomp-midi-latency-probe-aarch64.zip
