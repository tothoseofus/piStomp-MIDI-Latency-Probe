name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/version.py
          version=$(tr -d '\r\n' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pistomp-aarch64
            compiler: aarch64-linux-gnu-gcc
            binary: latency_probe.so
            packages: gcc-aarch64-linux-gnu
          - target: linux-x86_64
            compiler: gcc
            binary: latency_probe.so
            packages: gcc
          - target: windows-x86_64
            compiler: x86_64-w64-mingw32-gcc
            binary: latency_probe.dll
            packages: gcc-mingw-w64-x86-64
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lv2-dev ${{ matrix.packages }} file
      - name: Stage Windows LV2 headers
        if: matrix.target == 'windows-x86_64'
        run: |
          mkdir -p build/windows-lv2-headers
          cp -a /usr/include/lv2 build/windows-lv2-headers/
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.target }}' == 'windows-x86_64' ]]; then
            make CC=${{ matrix.compiler }} CPPFLAGS=-Ibuild/windows-lv2-headers BINARY=${{ matrix.binary }} BUILD_DIR=build/${{ matrix.target }} all
          else
            make CC=${{ matrix.compiler }} BINARY=${{ matrix.binary }} BUILD_DIR=build/${{ matrix.target }} all
          fi
      - name: Validate built bundle
        shell: bash
        run: |
          set -euo pipefail
          b=build/${{ matrix.target }}/pistomp-midi-latency-probe.lv2
          test -s "$b/${{ matrix.binary }}"
          test -s "$b/modgui/screenshot-latency-probe.png"
          test -s "$b/modgui/thumbnail-latency-probe.png"
          test -s "$b/LICENSE"
          grep -Fq 'https://github.com/tothoseofus/piStomp-MIDI-Latency-Probe' "$b/manifest.ttl"
          grep -Fq 'foaf:name "Ken Spanks"' "$b/latency_probe.ttl"
          micro=$(cut -d. -f3 VERSION)
          grep -Fq "lv2:microVersion $micro" "$b/latency_probe.ttl"
          grep -Fq '<${{ matrix.binary }}>' "$b/manifest.ttl"
      - name: Package release ZIP (one bundle directory)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/${{ matrix.target }} && zip -qr "${GITHUB_WORKSPACE}/dist/pistomp-midi-latency-probe-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.zip" pistomp-midi-latency-probe.lv2)
          unzip -l dist/*.zip | grep -F 'pistomp-midi-latency-probe.lv2/manifest.ttl'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all assets and no existing release/tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Increment VERSION for the next release."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="RELEASE_NOTES_${TAG}.md"
          if [[ ! -f "$notes" ]]; then
            notes="$(mktemp)"
            printf '# %s\n\n**SAFETY: DO NOT CONNECT THE ENCODED MIDI PCM OUTPUT TO SPEAKERS OR AMPLIFIERS.**\n' "$TAG" > "$notes"
          fi
          gh release create "$TAG" dist/*.zip --target "${GITHUB_SHA}" \
            --title "piStomp MIDI Latency Probe $TAG" \
            --notes-file "$notes"
