name: Prepare Patchstorage Upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag (for example v0.0.1)
        required: true
        default: v0.0.1

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download verified GitHub release bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets patchstorage-upload
          gh release download "$TAG" --pattern '*pistomp-aarch64.zip' --dir release-assets
          gh release download "$TAG" --pattern '*linux-x86_64.zip' --dir release-assets
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 2
      - name: Prepare Patchstorage tarballs and instructions
        shell: bash
        run: |
          set -euo pipefail
          for target in pistomp-aarch64 linux-x86_64; do
            mkdir -p "tmp/$target"
            unzip -q release-assets/*"$target".zip -d "tmp/$target"
            test -s "tmp/$target/pistomp-midi-latency-probe.lv2/manifest.ttl"
            tar -czf "patchstorage-upload/pistomp-midi-latency-probe-${{ inputs.tag }}-${target}.tar.gz" -C "tmp/$target" pistomp-midi-latency-probe.lv2
          done
          cp patchstorage/DESCRIPTION.md patchstorage/PUBLISHING.md patchstorage-upload/
          cp lv2/modgui/screenshot-latency-probe.png patchstorage-upload/artwork.png
      - name: Upload Patchstorage publication package
        uses: actions/upload-artifact@v4
        with:
          name: patchstorage-upload-${{ inputs.tag }}
          path: patchstorage-upload/
          if-no-files-found: error
